<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 승인 처리 중</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 20px;
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        p {
            color: #666;
            line-height: 1.5;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #0051FF;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #003ebd;
        }
    </style>
</head>
<body>

    <div class="card" id="status-card">
        <div class="icon">⏳</div>
        <h2>결제 승인 중입니다</h2>
        <p>안전하게 결제를 처리하고 있습니다.<br>잠시만 기다려주세요...</p>
    </div>

    <script>
        async function confirmPayment() {
            const urlParams = new URLSearchParams(window.location.search);
            const paymentKey = urlParams.get("paymentKey");
            const orderId = urlParams.get("orderId");
            const amount = urlParams.get("amount");

            const card = document.getElementById("status-card");

            if (!paymentKey || !orderId || !amount) {
                card.innerHTML = `
                    <div class="icon">❌</div>
                    <h2>잘못된 요청입니다</h2>
                    <p>결제 정보가 올바르지 않습니다.</p>
                    <a href="/" class="btn">메인으로 돌아가기</a>
                `;
                return;
            }

            try {
                const response = await fetch("/api/confirm-payment", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        paymentKey: paymentKey,
                        orderId: orderId,
                        amount: amount
                    })
                });

                const result = await response.json();

                if (response.ok) {
                    card.innerHTML = `
                        <div class="icon">🎉</div>
                        <h2>결제가 완료되었습니다!</h2>
                        <p><b>주문번호:</b> ${result.orderId || orderId}</p>
                        <p><b>결제금액:</b> ${Number(result.totalAmount || amount).toLocaleString()}원</p>
                        <a href="/" class="btn">쇼핑 계속하기</a>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="icon">⚠️</div>
                        <h2>결제 승인 실패</h2>
                        <p>${result.message || "결제 승인 중 오류가 발생했습니다."}</p>
                        <a href="/" class="btn">메인으로 돌아가기</a>
                    `;
                }
            } catch (error) {
                console.error("서버 통신 에러:", error);
                card.innerHTML = `
                    <div class="icon">🚨</div>
                    <h2>서버 연결 오류</h2>
                    <p>백엔드 서버(server.js)가 실행 중인지 확인해주세요.</p>
                    <a href="/" class="btn">메인으로 돌아가기</a>
                `;
            }
        }

        confirmPayment();
    </script>
</body>
</html>
